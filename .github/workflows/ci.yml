name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Go Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Verify Go Modules
        run: |
          go mod download
          go mod verify

      - name: Code Formatting Check (gofmt)
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "Formatting issues found:"
            echo "$DIFF"
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Application Binary
        run: go build -v -o bin/api ./cmd/api

